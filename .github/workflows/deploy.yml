name: Deploy

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm install dependencies
        run: npm install

      - name: run prettier
        run: npm run prettier

      - name: run tslint
        run: npm run lint

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev

      - name: run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest

    needs: test

    permissions:
      id-token: write
      contents: read

    env:
      BUGSNAG_KEY: ${{ secrets.BUGSNAG_KEY }}
      ROOT_URL: https://polls.pizza

    steps:
      - uses: actions/checkout@v2

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320802729995:role/polls-pizza-deploy
          aws-region: us-west-2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install dependencies
        run: npm install

      - name: build the site
        run: npm run build
        env:
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          NODE_ENV: prod
          PIZZA_BASE_DOMAIN: https://base.polls.pizza

      - name: Push the site to S3
        run: aws s3 sync dist/www s3://${{ secrets.PROD_BUCKET }} --acl public-read --follow-symlinks --delete

      # Set Cache-Control headers per file so HTML always revalidates and only
      # content-hashed build assets are cached immutably. Without this, a client
      # can run a stale build/app.js whose chunk manifest references files the
      # next deploy deleted (see #156).
      - name: Set Cache-Control headers
        run: node scripts/set-cache-headers.mjs ${{ secrets.PROD_BUCKET }}


      - name: publish to bugsnag
        run: npm run bugsnag

      - name: Bugsnag Release
        uses: psprings/bugsnag-release-action@v0.0.3
        with:
          apiKey: ${{ secrets.BUGSNAG_KEY }}
          releaseStage: prod

      - name: Invalidate cache & wait for completion
        uses: muratiger/invalidate-cloudfront-and-wait-for-completion-action@master
        env:
          AWS_REGION: "us-east-1"
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
          PATHS: "/*"
