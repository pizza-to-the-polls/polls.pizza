name: Test

on:
  pull_request:
    branches:
      - master
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm install dependencies
        run: npm install

      - name: run prettier
        run: npm run prettier

      - name: run tslint
        run: npm run lint

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev

      - name: run tests
        # Sandbox disabled in stencil.config.ts testing.browserArgs for headless CI runners
        run: npm run test

  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install dependencies
        run: npm install

      - name: build site
        run: npm run build
        env:
          ROOT_URL: https://next.polls.pizza
          STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
          NODE_ENV: stage
          PIZZA_BASE_DOMAIN: https://base-next.polls.pizza
          BUGSNAG_KEY: ""

  deploy-staging:
    if: >-
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [test, build]
    concurrency:
      group: polls-pizza-shared-staging
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write

    env:
      BUGSNAG_KEY: ${{ secrets.BUGSNAG_KEY }}
      ROOT_URL: https://next.polls.pizza

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320802729995:role/polls-pizza-deploy
          aws-region: us-west-2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install dependencies
        run: npm install

      - name: build site
        run: npm run build
        env:
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY_TEST }}
          NODE_ENV: stage
          PIZZA_BASE_DOMAIN: https://base-next.polls.pizza
          BUGSNAG_KEY: ${{ secrets.BUGSNAG_KEY }}

      - name: Deploy to staging
        run: |
          # Pass 1: sync everything EXCEPT build/, pruning objects that no longer exist.
          aws s3 sync dist/www s3://${{ secrets.DEV_BUCKET }} --acl public-read --follow-symlinks --delete --exclude "build/*"
          # Pass 2: upload build/ WITHOUT --delete so old content-hashed chunks survive.
          # A retained chunk keeps stale HTML working, so a client holding an old page
          # (or an old edge copy) can still boot instead of 404-ing on a preloaded chunk.
          aws s3 sync dist/www/build s3://${{ secrets.DEV_BUCKET }}/build --acl public-read --follow-symlinks

      # Set Cache-Control headers per file so HTML always revalidates and only
      # content-hashed build assets are cached immutably. Without this, a client
      # can run a stale build/app.js whose chunk manifest references files the
      # next deploy deleted (see #156).
      - name: Set Cache-Control headers
        run: node scripts/set-cache-headers.mjs ${{ secrets.DEV_BUCKET }}


      - name: publish to bugsnag
        run: npm run bugsnag

      - name: Bugsnag Release
        uses: psprings/bugsnag-release-action@v0.0.3
        with:
          apiKey: ${{ secrets.BUGSNAG_KEY }}
          releaseStage: stage

      - name: Invalidate cache & wait for completion
        uses: muratiger/invalidate-cloudfront-and-wait-for-completion-action@master
        env:
          AWS_REGION: "us-east-1"
          DISTRIBUTION_ID: ${{ secrets.STAGE_DISTRIBUTION_ID }}
          PATHS: "/*"
